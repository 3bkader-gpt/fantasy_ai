name: Autonomous FPL Agent & Pages Deploy

on:
  schedule:
    # Run every Friday at 09:00 UTC & Saturday at 08:30 UTC (FPL Gameweek prep & deadline execution)
    - cron: '0 9 * * 5'
    - cron: '30 8 * * 6'
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Execution Mode (live = real transfers on FPL, dry-run = simulation)'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - dry-run
      stage:
        description: 'Stage (tactical = MILP Optimization & Transfers, safety = T-20m Lineup Safety Check)'
        required: false
        default: 'tactical'
        type: choice
        options:
          - tactical
          - safety

permissions:
  contents: write

jobs:
  run-autonomous-agent:
    name: Execute MILP Solver & Deploy Telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Setup Node.js 20 & Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⚙️ Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 🤖 Run Autonomous FPL Manager
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.8-flash'
          FPL_EMAIL: ${{ secrets.FPL_EMAIL }}
          FPL_PASSWORD: ${{ secrets.FPL_PASSWORD }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID || '10469492' }}
          MAX_ALLOWED_HITS: ${{ secrets.MAX_ALLOWED_HITS || '1' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.execution_mode || 'live' }}"
          STAGE="${{ github.event.inputs.stage || 'tactical' }}"
          echo "🚀 Starting Autonomous Agent (Mode: $MODE, Stage: $STAGE)"

          FLAG="--live"
          if [ "$MODE" = "dry-run" ]; then
            FLAG="--dry-run"
          fi

          if [ "$STAGE" = "safety" ]; then
            echo "🛡️ Running T-20m Pre-Deadline Safety Pulse..."
            python scheduler.py --safety-check $FLAG
          else
            echo "⚽ Running Tactical Optimization & Transfers..."
            python main.py $FLAG
          fi

      - name: 🚀 Deploy Dashboard to Cloudflare Pages
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚡ Deploying dashboard to Cloudflare Pages..."
            npx wrangler pages deploy dashboard --project-name fantasy-ai-dashboard --commit-dirty=true || echo "::warning::Cloudflare deployment failed. Verify CLOUDFLARE_API_TOKEN permissions."
          else
            echo "⚠️ CLOUDFLARE_API_TOKEN secret not configured. Skipping automated remote deploy."
          fi

      - name: 💾 Commit & Push Updated Telemetry
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/squad_data.json || true
          if git diff --staged --quiet; then
            echo "No changes in telemetry data to commit."
          else
            git commit -m "chore(telemetry): auto-update squad telemetry [skip ci]"
            git push
          fi
